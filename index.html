<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="فردوس؛ وب‌سایت فردوس با مطالب، اطلاعات و محتوای مرتبط با فردوس."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>فردوس | وب‌سایت فردوس</title>


    <style>

        /* ==================================================
           FONT
        ================================================== */

        @font-face {
            font-family: "Playback";
            src: url("./playback.woff2") format("woff2");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }


        /* ==================================================
           RESET
        ================================================== */

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            min-height: 100vh;

            background-color: #f8f9fa;

            color: #020c58;

            font-family:
                Tahoma,
                "Segoe UI",
                Arial,
                sans-serif;

            line-height: 1.6;

            overflow-x: hidden;
        }


        img {
            display: block;
            max-width: 100%;
        }


        a {
            color: inherit;
        }


        button {
            font: inherit;
        }


        /* ==================================================
           HEADER
           
           کل سایت RTL است،
           اما Header عمداً LTR است.
           
           بنابراین:
           لوگو = چپ
           همبرگر = راست
        ================================================== */

        .site-header {
            position: sticky;

            top: 0;

            z-index: 1000;

            width: 100%;

            background-color: #ffffff;

            direction: ltr;

            box-shadow:
                0 2px 12px rgba(0, 0, 0, 0.06);
        }


        /* ==================================================
           HEADER INNER
        ================================================== */

        .header-inner {
            width: 100%;

            min-height: 76px;

            display: flex;

            flex-direction: row;

            align-items: center;

            justify-content: space-between;

            padding: 0 24px;

            direction: ltr;
        }


        /* ==================================================
           LOGO
        ================================================== */

        .brand {
            display: inline-flex;

            align-items: center;

            justify-content: flex-start;

            flex-shrink: 0;

            color: #020c58;

            text-decoration: none;

            line-height: 1;
        }


        .brand-text {
            display: block;

            font-family: "Playback", sans-serif;

            font-size: 40px;

            font-weight: 400;

            line-height: 1;

            letter-spacing: 1px;

            white-space: nowrap;
        }


        .brand:focus-visible {
            outline: 2px solid #020c58;

            outline-offset: 6px;
        }


        /* ==================================================
           HEADER ACTIONS
        ================================================== */

        .header-actions {
            display: flex;

            align-items: center;

            justify-content: center;

            flex-shrink: 0;
        }


        /* ==================================================
           HAMBURGER
        ================================================== */

        .menu-toggle {
            position: relative;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            width: 36px;

            height: 26px;

            padding: 0;

            border: 0;

            outline: 0;

            background: transparent;

            cursor: pointer;

            flex-shrink: 0;

            -webkit-tap-highlight-color: transparent;
        }


        .menu-toggle span {
            display: block;

            width: 100%;

            height: 3px;

            background-color: #020c58;

            border-radius: 0;

            transform-origin: center;

            transition:
                transform 0.25s ease,
                opacity 0.2s ease;
        }


        .menu-toggle:hover {
            opacity: 0.8;
        }


        .menu-toggle:focus-visible {
            outline: 2px solid #020c58;

            outline-offset: 6px;
        }


        /* ==================================================
           HAMBURGER → X
        ================================================== */

        .menu-toggle.is-open span:nth-child(1) {
            transform:
                translateY(11.5px)
                rotate(45deg);
        }


        .menu-toggle.is-open span:nth-child(2) {
            opacity: 0;
        }


        .menu-toggle.is-open span:nth-child(3) {
            transform:
                translateY(-11.5px)
                rotate(-45deg);
        }


        /* ==================================================
           MOBILE NAV
           
           خود Header LTR است،
           اما محتوای منو فارسی و RTL است.
        ================================================== */

        .mobile-nav {
            position: absolute;

            top: 100%;

            right: 0;

            left: 0;

            display: flex;

            flex-direction: column;

            gap: 0;

            width: 100%;

            padding:
                8px 24px 16px;

            background-color: #ffffff;

            border-top:
                1px solid #eeeeee;

            direction: rtl;

            text-align: right;

            visibility: hidden;

            opacity: 0;

            transform:
                translateY(-8px);

            pointer-events: none;

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.07);

            transition:
                opacity 0.2s ease,
                transform 0.2s ease,
                visibility 0.2s ease;
        }


        .mobile-nav.is-open {
            visibility: visible;

            opacity: 1;

            transform: translateY(0);

            pointer-events: auto;
        }


        .mobile-nav a {
            display: block;

            width: 100%;

            padding: 11px 0;

            color: #020c58;

            font-size: 16px;

            font-weight: 500;

            line-height: 1.6;

            text-align: right;

            text-decoration: none;

            border-bottom:
                1px solid #f0f0f0;

            transition:
                color 0.2s ease;
        }


        .mobile-nav a:last-child {
            border-bottom: 0;
        }


        .mobile-nav a:hover {
            color: #3046a5;
        }


        /* ==================================================
           MAIN
        ================================================== */

        main {
            width: 100%;

            direction: rtl;
        }


        /* ==================================================
           HERO
        ================================================== */

        .hero {
            width: 100%;

            padding:
                20px 24px 0;
        }


        .hero-inner {
            width: 100%;

            max-width: 1400px;

            margin:
                0 auto;
        }


        .hero-image {
            display: block;

            width: 100%;

            height: auto;

            border-radius: 12px;

            box-shadow:
                0 4px 18px
                rgba(0, 0, 0, 0.07);
        }


        /* ==================================================
           TABLET
           768px تا 1023px
        ================================================== */

        @media (min-width: 768px)
        and (max-width: 1023px) {

            .header-inner {
                min-height: 68px;

                padding:
                    0 20px;
            }


            .brand-text {
                font-size: 34px;

                letter-spacing: 1px;
            }


            .menu-toggle {
                width: 32px;

                height: 23px;
            }


            .menu-toggle span {
                height: 3px;
            }


            .menu-toggle.is-open span:nth-child(1) {
                transform:
                    translateY(10px)
                    rotate(45deg);
            }


            .menu-toggle.is-open span:nth-child(3) {
                transform:
                    translateY(-10px)
                    rotate(-45deg);
            }


            .mobile-nav {
                padding-left: 20px;

                padding-right: 20px;
            }


            .hero {
                padding:
                    16px 18px 0;
            }


            .hero-image {
                border-radius: 10px;
            }
        }


        /* ==================================================
           MOBILE
           0 تا 767px
        ================================================== */

        @media (max-width: 767px) {

            .header-inner {
                min-height: 58px;

                padding:
                    0 15px;
            }


            .brand-text {
                font-size: 27px;

                letter-spacing: 0.5px;
            }


            .menu-toggle {
                width: 27px;

                height: 19px;
            }


            .menu-toggle span {
                height: 3px;
            }


            .menu-toggle.is-open span:nth-child(1) {
                transform:
                    translateY(8px)
                    rotate(45deg);
            }


            .menu-toggle.is-open span:nth-child(3) {
                transform:
                    translateY(-8px)
                    rotate(-45deg);
            }


            .mobile-nav {
                padding:
                    7px 15px 14px;
            }


            .mobile-nav a {
                padding:
                    10px 0;

                font-size: 15px;
            }


            .hero {
                padding:
                    10px 10px 0;
            }


            .hero-image {
                border-radius: 8px;

                box-shadow:
                    0 3px 12px
                    rgba(0, 0, 0, 0.06);
            }
        }


        /* ==================================================
           REDUCED MOTION
        ================================================== */

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior: auto;
            }


            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }

    </style>
</head>


<body>


    <!-- ==================================================
         HEADER
    ================================================== -->

    <header
        class="site-header"
    >

        <div
            class="header-inner"
        >

            <!-- =========================
                 LOGO - LEFT
            ========================== -->

            <a
                href="/"
                class="brand"
                aria-label="صفحه اصلی فردوس"
            >
                <span class="brand-text">
                    FERDOWS
                </span>
            </a>


            <!-- =========================
                 HAMBURGER - RIGHT
            ========================== -->

            <div
                class="header-actions"
            >

                <button
                    type="button"
                    class="menu-toggle"
                    id="menuToggle"
                    aria-label="باز کردن منو"
                    aria-expanded="false"
                    aria-controls="mobileNav"
                >

                    <span></span>

                    <span></span>

                    <span></span>

                </button>

            </div>

        </div>


        <!-- ==================================================
             MOBILE NAV
             این قسمت فارسی و RTL است.
        ================================================== -->

        <nav
            class="mobile-nav"
            id="mobileNav"
            aria-label="منوی اصلی"
            aria-hidden="true"
        >

            <a href="/">
                صفحه اصلی
            </a>

            <a href="/about/">
                درباره ما
            </a>

            <a href="/contact/">
                تماس با ما
            </a>

        </nav>

    </header>


    <!-- ==================================================
         MAIN CONTENT
    ================================================== -->

    <main>

        <section
            class="hero"
            aria-labelledby="hero-title"
        >

            <div
                class="hero-inner"
            >

                <!--
                    H1 برای SEO
                    hidden است چون عنوان بصری
                    داخل Banner قرار دارد.
                -->

                <h1
                    id="hero-title"
                    hidden
                >
                    فردوس
                </h1>


                <img
                    class="hero-image"
                    src="./banner.jpg"
                    alt="فردوس؛ کتاب و فنجان قهوه در فضایی برای مطالعه"
                    width="1280"
                    height="720"
                    fetchpriority="high"
                >

            </div>

        </section>

    </main>


    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script>

        const menuToggle =
            document.getElementById("menuToggle");

        const mobileNav =
            document.getElementById("mobileNav");


        /* ==================================================
           OPEN / CLOSE MENU
        ================================================== */

        menuToggle.addEventListener(
            "click",
            function () {

                const isOpen =
                    menuToggle.classList.toggle(
                        "is-open"
                    );


                mobileNav.classList.toggle(
                    "is-open",
                    isOpen
                );


                menuToggle.setAttribute(
                    "aria-expanded",
                    String(isOpen)
                );


                menuToggle.setAttribute(
                    "aria-label",
                    isOpen
                        ? "بستن منو"
                        : "باز کردن منو"
                );


                mobileNav.setAttribute(
                    "aria-hidden",
                    String(!isOpen)
                );

            }
        );


        /* ==================================================
           CLOSE WITH ESCAPE
        ================================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape" &&
                    menuToggle.classList.contains(
                        "is-open"
                    )
                ) {

                    menuToggle.click();

                    menuToggle.focus();

                }

            }
        );


        /* ==================================================
           CLOSE AFTER CLICKING NAV LINK
        ================================================== */

        mobileNav
            .querySelectorAll("a")
            .forEach(
                function (link) {

                    link.addEventListener(
                        "click",
                        function () {

                            if (
                                menuToggle.classList.contains(
                                    "is-open"
                                )
                            ) {

                                menuToggle.click();

                            }

                        }
                    );

                }
            );

    </script>

</body>

</html>
